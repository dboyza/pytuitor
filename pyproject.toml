[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytuitor"
version = "1.0.0rc1"
description = "An offline Python apprenticeship in your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual[syntax]>=8.2.8,<9", "platformdirs>=4,<5"]

[project.scripts]
pytuitor = "pytuitor.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
