name: Windows diagnostics

on:
  push:
    paths:
      - .github/workflows/windows-diagnostics.yml

permissions:
  contents: read

jobs:
  isolate:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [test_check_next_action.py, test_integrated_visuals.py, test_release.py, test_unified_onboarding.py]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.14"
      - run: uv sync --locked
      - name: Reproduce test module
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Force .artifacts | Out-Null
          uv run --locked pytest -vv -x -o faulthandler_timeout=30 --durations=20 tests/${{ matrix.module }} 2>&1 | Tee-Object -FilePath .artifacts/windows-group.log
          exit $LASTEXITCODE
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-module-${{ matrix.module }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
