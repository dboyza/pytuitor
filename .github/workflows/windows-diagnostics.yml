name: Windows diagnostics

on:
  push:
    paths:
      - .github/workflows/windows-diagnostics.yml

permissions:
  contents: read

jobs:
  isolate:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.14"
      - run: uv sync --locked
      - name: Reproduce test group
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Force .artifacts | Out-Null
          $files = @(Get-ChildItem tests/test_*.py | Where-Object { $_.Name -notin @('test_windows_terminal.py', 'test_terminal_keys.py') } | Sort-Object Name)
          $selected = @(for ($index = ${{ matrix.group }}; $index -lt $files.Count; $index += 8) { $files[$index].FullName })
          $selected | Write-Output
          uv run --locked pytest -vv -x -o faulthandler_timeout=30 --durations=20 @selected 2>&1 | Tee-Object -FilePath .artifacts/windows-group.log
          exit $LASTEXITCODE
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-group-${{ matrix.group }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
