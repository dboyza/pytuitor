name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
        python: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify CLI startup
        run: uv run --locked --python ${{ matrix.python }} pytuitor --help
      - name: Run tests
        run: uv run --locked --python ${{ matrix.python }} pytest
      - name: Check lint
        run: uv run --locked --python ${{ matrix.python }} ruff check .
      - name: Check formatting
        run: uv run --locked --python ${{ matrix.python }} ruff format --check .
      - name: Build distributions
        run: uv build
      - name: Verify installed wheel and all reference programs
        timeout-minutes: 5
        run: >-
          uv run --isolated --no-project
          --python ${{ matrix.python }}
          --with dist/pytuitor-1.0.0rc1-py3-none-any.whl
          python -I scripts/smoke_installed.py
